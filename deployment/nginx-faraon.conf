# Nginx site config: terminates wss:// (TLS by Certbot) and proxies the
# WebSocket upgrade to the Godot server on loopback port 9000.
# Install to /etc/nginx/sites-available/faraon, symlink to sites-enabled,
# replace faraon.example.com with the real (sub)domain, then run certbot.

server {
    listen 80;
    server_name faraon.example.com;
    # Certbot rewrites this server block for the HTTP->HTTPS redirect.

    location /ws {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;  # idle turn-based sockets must survive
        proxy_send_timeout 3600s;
    }
}
